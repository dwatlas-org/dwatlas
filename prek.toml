[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-merge-conflict" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.3"
hooks = [
  { id = "ruff-check", types_or = ["python", "pyi"], args = ["--fix"] },
  { id = "ruff-format", types_or = ["python", "pyi"] }
]

[[repos]]
repo = "https://github.com/oxc-project/mirrors-oxlint"
rev = "v1.78.0"
hooks = [
  { id = "oxlint", args = ["--fix"], files = "^web/" }
]

[[repos]]
repo = "local"
hooks = [
  { id = "prettier", name = "prettier (web)", entry = "pnpx prettier --write", language = "system", types_or = ["javascript", "jsx", "ts", "tsx", "json", "css", "scss"], files = "^web/" }
]
